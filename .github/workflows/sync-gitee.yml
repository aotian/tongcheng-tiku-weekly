name: Sync to Gitee & Pack Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/contract.mjs
      - run: node test/paper-intake.mjs
      - run: node --test test/updater.mjs test/paper-bank.mjs

  sync-gitee:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror push to Gitee
        env:
          GITEE_REPO_URL: ${{ secrets.GITEE_REPO_URL }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          : "${GITEE_REPO_URL:?missing GITEE_REPO_URL}" "${GITEE_TOKEN:?missing GITEE_TOKEN}" "${GITEE_USER:?missing GITEE_USER}"
          AUTH_URL="${GITEE_REPO_URL/https:\/\//https://${GITEE_USER:-oauth2}:${GITEE_TOKEN}@}"
          git remote add gitee "$AUTH_URL"
          git push gitee refs/remotes/origin/main:refs/heads/main
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git push gitee "$GITHUB_REF:$GITHUB_REF"
          fi

  windows-update-check:
    needs: sync-gitee
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/check-published-update.mjs

  pack-tag:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run contract tests
        run: node test/contract.mjs
      - name: Pack tarball
        run: npm pack
      - name: Upload tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
